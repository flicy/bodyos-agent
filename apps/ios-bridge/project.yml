name: FitCrewHealthBridge
options:
  bundleIdPrefix: com.fitcrew
  deploymentTarget:
    iOS: "17.0"
packages:
  FitCrewHealthCore:
    path: Core
targets:
  FitCrewHealthBridge:
    type: application
    platform: iOS
    sources:
      - FitCrewHealthBridge
    info:
      path: FitCrewHealthBridge/Info.plist
    entitlements:
      path: FitCrewHealthBridge/FitCrewHealthBridge.entitlements
    dependencies:
      - package: FitCrewHealthCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fitcrew.healthbridge
        PRODUCT_NAME: FitCrew Health Bridge
        SWIFT_VERSION: 6.0
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
  FitCrewHealthBridgeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - FitCrewHealthBridgeTests
    dependencies:
      - target: FitCrewHealthBridge
      - package: FitCrewHealthCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fitcrew.healthbridge.tests
        SWIFT_VERSION: 6.0
schemes:
  FitCrewHealthBridge:
    build:
      targets:
        FitCrewHealthBridge: all
        FitCrewHealthBridgeTests: [test]
    test:
      targets:
        - FitCrewHealthBridgeTests
